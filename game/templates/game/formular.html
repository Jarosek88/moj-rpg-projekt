<!DOCTYPE html>
<html>

<head>
    <title>Nový Hrdina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container py-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
        <h2 class="mb-4">➕ Pridaj nového hrdinu</h2>
        <form method="POST">
            {% csrf_token %} {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100">Vytvoriť hrdinu</button>
        </form>
        <a href="/postavy/" class="btn btn-link w-100 mt-2">Späť na zoznam</a>
    </div>
</body>

</html>
