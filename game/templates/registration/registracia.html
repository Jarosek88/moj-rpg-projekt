<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <title>Registrácia hrdinu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="text-center mb-4">🛡️ Nový hrdina</h2>
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-success w-100 mt-3">Zaregistrovať sa</button>
                        </form>
                        <p class="mt-3 text-center">
                            Už máš účet? <a href="{% url 'login' %}">Prihlás sa</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
